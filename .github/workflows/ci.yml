name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # Expose secrets as env vars so conditionals can use the `env` context (the `secrets` context is not supported in `if:`).
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}

      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify Submodules
      run: |
        ls -la extern
        ls -la extern/JUCE

    - name: Install CMake
      run: brew install cmake

    - name: Create Build Directory
      run: mkdir build

    - name: Configure CMake
      working-directory: build
      run: |
        ls -la ../extern/JUCE/
        cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations"

    - name: Build
      working-directory: build
      run: |
        set -euo pipefail
        cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 2 --target Raveland_Standalone Raveland_VST3 Raveland_AU

    - name: Package macOS (unsigned zip)
      run: |
        set -euo pipefail
        bash scripts/macos_package_unsigned.sh build/Raveland_artefacts/Release dist

    - name: List Build Artifacts
      working-directory: build
      run: find Raveland_artefacts -type f -name "*" | head -20

    - name: Assert AU/VST3 outputs exist
      working-directory: build
      run: |
        set -euo pipefail
        echo "Listing build/Raveland_artefacts:"
        find Raveland_artefacts -maxdepth 3 -type d -print

        echo "Expected macOS plugin bundles:"
        find Raveland_artefacts -maxdepth 4 -type d \( -name "*.component" -o -name "*.vst3" -o -name "*.app" \) -print

        test -d "Raveland_artefacts/Release/VST3/RaveLand.vst3"
        test -d "Raveland_artefacts/Release/AU/RaveLand.component"
        test -d "Raveland_artefacts/Release/Standalone/RaveLand.app"

    - name: Prepare code signing (optional)
      if: ${{ env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
      run: |
        set -euo pipefail
        CERT_P12="$RUNNER_TEMP/cert.p12"
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_P12"

        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain

        security import "$CERT_P12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

    - name: Write notarization key (optional)
      if: ${{ env.APPLE_NOTARY_KEY_BASE64 != '' }}
      run: |
        set -euo pipefail
        NOTARY_KEY="$RUNNER_TEMP/notary_api_key.p8"
        echo "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
        echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY" >> "$GITHUB_ENV"

    - name: Sign + notarize artefacts (optional, recommended for distribution)
      if: ${{ env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' }}
      env:
        APPLE_SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
        APPLE_NOTARY_KEY_ID: ${{ env.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ env.APPLE_NOTARY_ISSUER_ID }}
        APPLE_NOTARY_KEY_PATH: ${{ env.APPLE_NOTARY_KEY_PATH }}
      run: |
        set -euo pipefail
        bash scripts/macos_sign_and_notarize.sh build/Raveland_artefacts/Release dist

    - name: Build macOS installer package (.pkg)
      env:
        APPLE_INSTALLER_IDENTITY: ${{ env.MACOS_INSTALLER_IDENTITY }}
        APPLE_NOTARY_KEY_ID: ${{ env.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ env.APPLE_NOTARY_ISSUER_ID }}
        APPLE_NOTARY_KEY_PATH: ${{ env.APPLE_NOTARY_KEY_PATH }}
      run: |
        set -euo pipefail
        bash scripts/macos_make_installer_pkg.sh build/Raveland_artefacts/Release dist

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Raveland-macOS
        path: |
          build/Raveland_artefacts/${{ env.BUILD_TYPE }}/Standalone/RaveLand.app/
          build/Raveland_artefacts/${{ env.BUILD_TYPE }}/VST3/RaveLand.vst3/
          build/Raveland_artefacts/${{ env.BUILD_TYPE }}/AU/RaveLand.component/
          dist/RaveLand-macOS-unsigned.zip
          dist/RaveLand-macOS.zip
          dist/RaveLand-Installer-unsigned.pkg
          dist/RaveLand-Installer.pkg

  build-windows:
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install NSIS
      run: |
        choco install nsis.install -y

    - name: Add NSIS to PATH
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $candidates = @(
          "${env:ProgramFiles(x86)}\\NSIS",
          (Join-Path $env:ChocolateyInstall "lib\\nsis.install\\tools"),
          (Join-Path $env:ChocolateyInstall "lib\\nsis\\tools")
        ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

        foreach ($p in $candidates) {
          $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

        where.exe makensis

    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF

    - name: Build
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel --target Raveland_Standalone Raveland_VST3

    - name: Make Windows Installer
      run: |
        pwsh -NoProfile -File scripts/windows_make_installer.ps1 `
          -ArtefactsDir "build\\Raveland_artefacts\\${{ env.BUILD_TYPE }}" `
          -OutDir "dist" `
          -Version "0.1.0" `
          -RequireInstaller

    - name: Code sign Windows outputs (optional)
      if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '' }}
      run: |
        $ErrorActionPreference = "Stop"

        $pfxPath = Join-Path $env:RUNNER_TEMP "windows_signing.pfx"
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

        function Find-SignTool {
          $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($cmd) { return $cmd.Source }
          $root = "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin"
          if (!(Test-Path $root)) { return $null }
          $candidates = Get-ChildItem -Path $root -Directory | Sort-Object Name -Descending | ForEach-Object {
            Join-Path $_.FullName "x64\\signtool.exe"
          }
          foreach ($c in $candidates) { if (Test-Path $c) { return $c } }
          return $null
        }

        $signtool = Find-SignTool
        if (-not $signtool) { throw "signtool.exe not found" }

        $targets = @(
          "build\\Raveland_artefacts\\${{ env.BUILD_TYPE }}\\Standalone\\RaveLand.exe",
          "build\\Raveland_artefacts\\${{ env.BUILD_TYPE }}\\VST3\\RaveLand.vst3\\Contents\\x86_64-win\\RaveLand.vst3",
          "dist\\RaveLand-Installer-Windows.exe"
        ) | Where-Object { Test-Path $_ }

        foreach ($t in $targets) {
          & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $t
        }

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Raveland-Windows
        path: |
          build/Raveland_artefacts/${{ env.BUILD_TYPE }}/Standalone/RaveLand.exe
          build/Raveland_artefacts/${{ env.BUILD_TYPE }}/VST3/RaveLand.vst3/
          dist/RaveLand-windows.zip
          dist/RaveLand-Installer-Windows.exe
